name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - {goarch: amd64, suffix: x86_64}
          - {goarch: arm64, suffix: aarch64}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: build
        run: GOOS=linux GOARCH=${{ matrix.goarch }} go build -o uptrack-linux-${{ matrix.suffix }} ./cmd/uptrack
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: uptrack-linux-${{ matrix.suffix }}
          generate_release_notes: true
